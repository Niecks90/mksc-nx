name: Switch Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false

      # Décode le BIOS depuis le secret GitHub sans rien commiter dans Git
      - name: Setup BIOS from secret
        env:
          BIOS_SECRET: ${{ secrets.GBA_BIOS_BASE64 }}
        run: |
          mkdir -p bios
          if [ -n "$BIOS_SECRET" ]; then
            echo "$BIOS_SECRET" | base64 -d > bios/gba_bios.bin
            echo "gba_bios.bin généré avec succès depuis le secret."
          else
            echo "::error::Secret GBA_BIOS_BASE64 manquant !"
            exit 1
          fi

      - name: Host Build Codegen and Recompile BIOS (Stage 1)
        run: |
          rm -rf build_host && mkdir build_host && cd build_host
          cmake ..
          # 1. Compiler uniquement l'outil de transpilation natif
          cmake --build . --target gba_recompile -j$(nproc)
          
          # 2. Localiser l'exécutable gba_recompile
          RECOMPILE_BIN=$(find . -type f -name gba_recompile -executable | head -n 1)
          echo "Utilisation de gba_recompile : $RECOMPILE_BIN"

          # 3. Détecter la configuration du BIOS si présente
          CONFIG_FLAG=""
          if [ -f "../gbarecomp/bios/gba_bios.toml" ]; then
            CONFIG_FLAG="--config ../gbarecomp/bios/gba_bios.toml"
          elif [ -f "../bios/gba_bios.toml" ]; then
            CONFIG_FLAG="--config ../bios/gba_bios.toml"
          fi

          # 4. Transpiler le BIOS vers le dossier attendu par gbarecomp
          $RECOMPILE_BIN --bios ../bios/gba_bios.bin $CONFIG_FLAG --out ../gbarecomp/src/runtime/generated_bios/
          cd ..

          # 5. Vérifier que bios_recompiled.cpp est généré
          echo "--- Contenu de generated_bios ---"
          ls -la gbarecomp/src/runtime/generated_bios/

      - name: Build Switch NRO (Stage 2)
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=/opt/devkitpro/devkitA64
          export PATH=/opt/devkitpro/tools/bin:/opt/devkitpro/devkitA64/bin:$PATH

          # Configuration CMake avec la toolchain Switch et Scanline HLE
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/Switch.cmake \
            -DGBARECOMP_SCANLINE_IMPLEMENTATION=HLE

          # Compilation finale du NRO
          cmake --build build -j$(nproc)

          # Vérifier la présence du binaire final
          ls -lh build/mksc_nx.nro

      - name: Upload Release (Stage 3)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/mksc_nx.nro
