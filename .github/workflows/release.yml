name: Switch Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Host Build Codegen (Stage 1)
        run: |
          rm -rf build_host && mkdir build_host && cd build_host
          cmake ..
          cmake --build . --target MarioKartSuperCircuitRecomp -j$(nproc)
          cmake --build . --target gba_recompile -j$(nproc)
          ./gbarecomp_build/tools/gba_recompile --bios ../bios/gba_bios.bin --output ../gbarecomp/src/runtime/generated_bios/
          cd ..
          mkdir -p generated
          ls -la generated/


      - name: Build Switch NRO (Stage 2)
        run: |
          export DEVKITPRO=/opt/devkitpro
          # Fix devkitpro package manager and install deps if needed (usually handled by the container)
          # dkp-pacman -Syu --noconfirm switch-dev switch-sdl2 switch-glad switch-glm

          export DEVKITA64=/opt/devkitpro/devkitA64
          export PATH=/opt/devkitpro/tools/bin:/opt/devkitpro/devkitA64/bin:$PATH

          # Configure CMake with Switch Toolchain
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/Switch.cmake
          # Build
          cmake --build build -j$(nproc)

      - name: Upload Release (Stage 3)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/mksc_nx.nro
